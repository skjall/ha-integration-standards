default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# The quality tier is enforced here, not asserted. The gates come from
# ha-integration-standards, so raising the rev below is how this project takes
# a newer set of rules - nothing in the integration itself changes.
repos:
  - repo: https://github.com/{{owner}}/ha-integration-standards
    rev: v0.1.0
    hooks:
      - id: ha-quality-scale
      - id: ha-coverage
      - id: ha-commit-message
      - id: ha-types
      - id: ha-tests
      - id: ha-sync

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key
