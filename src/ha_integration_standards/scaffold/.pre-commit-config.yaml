default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# The quality tier is enforced here, not asserted. The gates under
# scripts/_ha_standards/ are written by ha-integration-standards; take a newer
# set of rules with `ha-standards sync` and commit the diff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key
