# The gates, as a reusable workflow. An integration calls this with
#
#   jobs:
#     standards:
#       uses: skjall/ha-integration-standards/.github/workflows/ha-integration.yml@v0
#
# and takes a newer set of rules by moving that ref - nothing in the calling
# repository changes.
name: Home Assistant integration

on:
  workflow_call:
    inputs:
      python-version:
        description: The interpreter Home Assistant needs for the targeted release.
        type: string
        default: "3.14"
      standards-version:
        description: A pinned ha-integration-standards, or empty for the latest.
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  quality-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the standards
        run: pip install "ha-integration-standards${{ inputs.standards-version && format('=={0}', inputs.standards-version) || '' }}"
      # The tier is only worth something if the code still holds it.
      - run: ha-quality-scale
      # Managed files that have drifted mean the project is running rules it
      # no longer has.
      - run: ha-standards check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          pip install mypy pytest-homeassistant-custom-component
          pip install -r requirements-test.txt
          python scripts/ha_test_requirements.py > /tmp/components.txt
          pip install -r /tmp/components.txt
      - name: Type check
        run: mypy --strict --ignore-missing-imports custom_components

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          # What the components need comes from the installed Home Assistant
          # release, not from a hand-maintained pin.
          python scripts/ha_test_requirements.py > /tmp/components.txt
          pip install -r /tmp/components.txt
          pip install "ha-integration-standards${{ inputs.standards-version && format('=={0}', inputs.standards-version) || '' }}"
      - name: Run pytest
        run: |
          mkdir -p .artefakte
          pytest --cov-report="json:.artefakte/coverage.json"
      - name: Enforce the coverage the claimed tier requires
        run: ha-coverage

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
