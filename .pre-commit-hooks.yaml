# Pull these into an integration with:
#
#   - repo: https://github.com/{{owner}}/ha-integration-standards
#     rev: v0.1.0
#     hooks:
#       - id: ha-quality-scale
#       - id: ha-coverage
#       - id: ha-commit-message
#       - id: ha-types
#       - id: ha-tests
#       - id: ha-sync
#
# Raising `rev` is how a project takes a newer set of rules. Nothing in the
# integration itself has to change for that.

- id: ha-quality-scale
  name: Quality scale - the code holds what quality_scale.yaml claims
  entry: ha-quality-scale
  language: python
  pass_filenames: false
  always_run: true

- id: ha-coverage
  name: Coverage - the floors the claimed tier requires
  entry: ha-coverage
  language: python
  pass_filenames: false
  always_run: true

- id: ha-commit-message
  name: Commit message - Conventional Commits, in English
  entry: ha-commit-message
  language: python
  stages: [commit-msg]

- id: ha-types
  name: Types - mypy --strict against the targeted Home Assistant
  entry: ha-types
  language: python
  pass_filenames: false
  always_run: true

- id: ha-tests
  name: Tests - against the targeted Home Assistant, in Docker
  entry: ha-tests
  language: python
  pass_filenames: false
  always_run: true
  args: [-q]

- id: ha-sync
  name: Managed files - still the version this release ships
  entry: ha-sync
  language: python
  pass_filenames: false
  always_run: true
